[project]
name = "plaiground"
version = "0.1.0"
description = "A repository for learning Machine Learning by training Game AIs."
authors = [
    {name = "Giani Statie"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "torch >=2.3",
    "stable-baselines3 (>=2.7.1,<3.0.0)",
    "gymnasium (>=1.2.3,<2.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "opencv-python (>=4.13.0.92,<5.0.0.0)",
    "pynput (>=1.8.1,<2.0.0)",
    "scikit-learn (>=1.8.0,<2.0.0)",
    "ipywidgets (>=8.1.8,<9.0.0)",
    "jupyter (>=1.1.1,<2.0.0)",
    "rust-just (>=1.58.0,<2.0.0)",
    "zaina-ml-forge",
    "matplotlib>=3.11.2",
]

[dependency-groups]
dev = [
    "ipykernel (>=7.2.0,<8.0.0)"
]

[tool.uv]
package = false

[tool.uv.sources]
zaina-ml-forge = { path = "../ml_forge_plaiground", editable = true }
