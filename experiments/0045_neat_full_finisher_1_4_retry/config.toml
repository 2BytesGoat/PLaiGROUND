[experiment]
id = "0045"
name = "neat_full_finisher_1_4_retry"
status = "stopped_diagnostic"
started = "2026-10-29"
stopped = "2026-10-29"

[workflow]
name = "genetic.neat"

[game]
repo = "../dragon-jump-remaster"
branch = "prepare-for-expo"
commit = "adb9278"
allow_dirty = true

[env]
level = "1-4"
population = 384
parallel = 8
action_repeat = 4
speedup = 12.0
max_steps = 300

[observation]
encoding = "legacy_stick"
size = 61
note = "Frozen 61-value contract; on_ceiling retained for compatibility."

[action]
reassert_held_jump = true

[source]
seed_checkpoint = "runs/neat_seeded_1_4_stick/seed-checkpoint-0"
source_run = "runs/neat_seeded_1_4_stick/archive"
source_level = "1-4"
source_routes = 4
note = "Replay the 0038 seed with both live-finish metadata and evaluated finisher genomes preserved through reproduction."

[collection]
record_paths = true
generations = 60
min_clean_routes = 0
checkpoint_interval = 5
rebalance_every = 2
rebalance_final = true

[evaluation]
canonical = false
note = "Evaluate all 384 genomes on canonical 1-4 after training."

[seed_gate]
finish_rate_target = 0.90
clean_clusters_required = 4
note = "Do not use the checkpoint as the 1-5 seed until the evaluated population is finisher-rich and diverse."

[output]
dir = "runs/neat_seeded_1_4_stick_full_finishers"
archive_dir = "runs/neat_seeded_1_4_stick_full_finishers/archive"

[run]
command = "caffeinate -dimsu .venv/bin/python scripts/genetic/01_neat.py --level 1-4 --obs-encoding legacy_stick --reassert-held-jump --resume runs/neat_seeded_1_4_stick/seed-checkpoint-0 --output-dir runs/neat_seeded_1_4_stick_full_finishers --archive-dir runs/neat_seeded_1_4_stick_full_finishers/archive --generations 60 --population 384 --parallel 8 --action-repeat 4 --speedup 12 --max-steps 300 --record-paths --checkpoint-interval 5 --rebalance-every 2 --rebalance-final --port 17400"

[result]
status = "stopped_diagnostic"
note = "Reached 380/384 at generations 6 and 8, but rebalance-1 selected only 123 finishers: the 50 finishers slower than 10 s were classified as exploration and dropped. Superseded by 0046, which preserves all finishers."
