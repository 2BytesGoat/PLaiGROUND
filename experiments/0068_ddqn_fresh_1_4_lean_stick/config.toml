# Experiment 0068: 1-4 probe on the fresh lean_stick 191 chain.

[experiment]
id = "0068"
name = "ddqn_fresh_1_4_lean_stick"
status = "stopped_100k_probe"
started = "2026-10-29"
stopped = "2026-10-29"

[workflow]
name = "reinforcement.ddqn"

[game]
repo = "../dragon-jump-remaster"
branch = "prepare-for-expo"
commit = "adb9278"
allow_dirty = true

[env]
# Agreed level-N schedule: 4 current + 1 previous + 3 retention.
levels = ["1-4", "1-4", "1-4", "1-4", "1-3", "1-2", "1-2", "1-1"]
n_envs = 8
agents_per_process = 1
action_repeat = 4
max_decisions = 150
speedup = 12.0
force_start_jump = false
reassert_held_jump = true
reward_profile = "default"
base_port = 21000
eval_port = 21100
timeout = 180
seed = 42
start_seed = 42

[observation]
encoding = "lean_stick"
preprocessing = "lean_stick"
expected_raw_size = 191
model_input_size = 957
note = "Fresh 191 chain from the selected 0067 1.53M checkpoint. Old-level anchor covers 1-1/1-2/1-3."

[model]
arch = "dqn_mlp"
hidden = [512, 512]
activation = "relu"

[algorithm]
name = "dqn"
# 100k decision-point probe; the 0053 1-4 probe was stopped at 100k.
timesteps = 100000
n_steps = 3
learning_rate = 0.0001
buffer_size = 400000
online_buffer_size = 400000
anchor_fraction = 0.25
learning_starts = 10000
batch_size = 256
gamma = 0.99
tau = 1.0
train_freq = 4
gradient_steps = 4
target_update_interval = 1000
exploration_fraction = 0.5
exploration_initial_eps = 1.0
exploration_final_eps = 0.02

[data]
archive = "runs/neat_seeded_1_4_stick_full_population/archive/routes.json"
finishers = "runs/neat_seeded_1_4_stick_full_population/archive/finishers.jsonl"
level_analysis = "../dragon-jump-remaster/runs/level_analysis/1-4.json"
min_time_to_exit = 0.5
# 99 tagged starts: 12 x 1-1 + 31 x 1-2 + 45 x 1-3 + 11 x 1-4.
train_pool = "runs/neat_seeded_1_4_stick_full_population/pool/multilevel_train_start_pool.json"
holdout_pool = "runs/neat_seeded_1_4_stick_full_population/pool/holdout_start_pool.json"

[checkpointing]
save_freq = 25000

[result]
status = "stopped_100k_probe"
selected_checkpoint = "none"
note = "100k probe negative at every checkpoint (1.555M/1.58M/1.605M/1.63M): 1-4 canonical 0/1 (timeout; 1.63M also death), train 1/11 at 6.7833 s, holdout 0/2. The training monitor showed 0/310 canonical finishes and 13/136 state finishes (median 6.7833, best 6.1833). Old-level monitor: 1-2 canonical 3.1667 with 4 timeouts, 1-3 canonical 3.3167 with 2 no-finish, 1-1 canonical 1.5667. This reproduces the 0053 failure pattern; do not continue the DDQN 1-4 transfer without a different method."
probe_gate = "fail: 1-4 canonical 0/1, train 1/11, holdout 0/2"
retention_1_1 = "1.5667 canonical; 12/12, 3.2833; 8/8, 3.8000"
retention_1_2 = "3.1833 canonical; 31/31, 4.5833; 20/20, 3.9083"
retention_1_3 = "3.2333 canonical; 45/45, 5.4333; 23/23, 5.4333"

[evaluation]
canonical = true
train_pool = false
holdout_pool = false

[run]
resume_from = "runs/ddqn_fresh_1_1_retention_lean_stick/dqn/checkpoints/ddqn_1530000_steps.zip"
reset_timesteps = false
anchor_buffer_from = "runs/ddqn_anchor_1530000_all_levels_191/replay_buffer_200k.pkl"
preprocessing_from = "runs/ddqn_fresh_1_1_lean_stick/preprocessing.pkl"
device = "cpu"
verbose = 1

[output]
dir = "runs/ddqn_fresh_1_4_lean_stick"
model_file = "dqn/dqn_final.zip"
monitor_file = "dqn/monitor.csv"
checkpoint_dir = "dqn/checkpoints"
