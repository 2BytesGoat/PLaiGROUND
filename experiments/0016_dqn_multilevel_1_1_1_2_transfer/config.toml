[experiment]
id = "0016"
name = "dqn_multilevel_1_1_1_2_transfer"
status = "pilot complete"
started = "2026-10-29"
completed = "2026-10-29"

[workflow]
name = "reinforcement.dqn"

[game]
repo = "../dragon-jump-remaster"
branch = "prepare-for-expo"
commit = "adb9278"
allow_dirty = true

[env]
levels = "1-1,1-2"
n_envs = 8
agents_per_process = 1
action_repeat = 4
max_decisions = 150
speedup = 8.0
force_start_jump = false
reward_profile = "default"
base_port = 13400
eval_port = 13500
timeout = 180
seed = 42
start_seed = 42

[observation]
encoding = "lean"
preprocessing = "lean"
expected_raw_size = 188
model_input_size = 954

[model]
arch = "dqn_mlp"
hidden = [512, 512]
activation = "relu"

[algorithm]
name = "dqn"
# Additional steps after resume_from (1.85M + 100k pilot = 1.95M).
timesteps = 100000
n_steps = 3
learning_rate = 0.0001
buffer_size = 200000
learning_starts = 10000
batch_size = 256
gamma = 0.99
tau = 1.0
train_freq = 4
gradient_steps = 4
target_update_interval = 1000
exploration_fraction = 0.5
exploration_initial_eps = 1.0
exploration_final_eps = 0.02

[data]
archive = "runs/neat_clean_450_1_2_transfer/filtered_j07_cap1/train_clean_routes.json"
finishers = "runs/neat_clean_450_1_2_transfer/archive/finishers.jsonl"
level_analysis = "../dragon-jump-remaster/runs/level_analysis/1-2.json"
min_time_to_exit = 0.5
train_pool = "runs/dqn_multilevel_1_1_1_2/pool/train_start_pool.json"
holdout_pool = "runs/neat_clean_450_1_2_transfer/pool_j07_cap1/holdout_start_pool.json"

[checkpointing]
save_freq = 25000

[evaluation]
canonical = true
train_pool = false
holdout_pool = false

[result]
pilot_total_timesteps = 1950000
canonical_1_1 = 1.6167
train_1_1_median = 3.2500
holdout_1_1_median = 3.8000
canonical_1_2 = 3.7500
train_1_2_finishes = 31
train_1_2_median = 4.3833
train_1_2_best = 3.0500
holdout_1_2_finishes = 20
holdout_1_2_median = 4.0500
holdout_1_2_best = 3.0500
retention_gate = "pass"

[run]
resume_from = "runs/dqn_clean_start_1_1_8x1_buffer_finetune/dqn/dqn_final.zip"
reset_timesteps = false
preprocessing_from = "runs/ppo_clean_start_1_1_fresh/preprocessing.pkl"
device = "cpu"
verbose = 1

[output]
dir = "runs/dqn_multilevel_1_1_1_2"
model_file = "dqn/dqn_final.zip"
monitor_file = "dqn/monitor.csv"
checkpoint_dir = "dqn/checkpoints"
