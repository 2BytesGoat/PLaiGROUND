# Experiment 0058: fresh lean_stick 191 DDQN on 1-1.

[experiment]
id = "0058"
name = "ddqn_fresh_1_1_lean_stick"
status = "complete"
started = "2026-10-29"
completed = "2026-10-29"

[workflow]
name = "reinforcement.ddqn"

[game]
repo = "../dragon-jump-remaster"
branch = "prepare-for-expo"
commit = "adb9278"
allow_dirty = true

[env]
# Stage 1 of the 191 chain: 1-1 only, fresh backbone, discovered clean starts.
levels = ["1-1"]
n_envs = 8
agents_per_process = 1
action_repeat = 4
max_decisions = 150
speedup = 12.0
force_start_jump = false
reassert_held_jump = true
reward_profile = "default"
base_port = 19300
eval_port = 19400
timeout = 180
seed = 42
start_seed = 42

[observation]
encoding = "lean_stick"
preprocessing = "lean_stick"
expected_raw_size = 191
model_input_size = 957
note = "Fresh 191 backbone; lean 188 + on_ceiling + jump_held + stick_active. No 188 weights are loaded."

[model]
arch = "dqn_mlp"
hidden = [512, 512]
activation = "relu"

[algorithm]
name = "dqn"
timesteps = 1000000
n_steps = 3
learning_rate = 0.0001
buffer_size = 200000
learning_starts = 10000
batch_size = 256
gamma = 0.99
tau = 1.0
train_freq = 4
gradient_steps = 4
target_update_interval = 1000
exploration_fraction = 0.5
exploration_initial_eps = 1.0
exploration_final_eps = 0.02

[data]
archive = "runs/neat_clean_450/filtered/train_clean_routes.json"
finishers = "runs/neat_clean_450/archive/finishers.jsonl"
level_analysis = "../dragon-jump-remaster/runs/level_analysis/1-1.json"
min_time_to_exit = 0.5
train_pool = "runs/neat_clean_450/pool/train_start_pool.json"
holdout_pool = "runs/neat_clean_450/pool/holdout_start_pool.json"

[checkpointing]
save_freq = 25000

[result]
status = "complete; 1M selected"
selected_checkpoint = "runs/ddqn_fresh_1_1_lean_stick/dqn/dqn_final.zip"
selected_canonical = 1.5667
selected_train = "12/12, 3.2583"
selected_holdout = "8/8, 3.8000"
eval_tag = "0058_1m_reassert"
note = "The first eval pass omitted reassert_held_jump and reported 2.7000 canonical. With eval action semantics matching training, the 1M model is 1.5667 canonical, 12/12 train, 8/8 holdout. The 1M gate passes; 0059 is not needed."

[evaluation]
canonical = true
sets = ["runs/neat_clean_450/pool/train_start_pool.json", "runs/neat_clean_450/pool/holdout_start_pool.json"]

[run]
device = "cpu"
verbose = 1

[output]
dir = "runs/ddqn_fresh_1_1_lean_stick"
model_file = "dqn/dqn_final.zip"
monitor_file = "dqn/monitor.csv"
checkpoint_dir = "dqn/checkpoints"
