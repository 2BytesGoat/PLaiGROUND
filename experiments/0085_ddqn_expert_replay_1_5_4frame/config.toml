# 0085 — 4-frame DDQN with the fastest 1-5 expert cluster.
# The 2-frame control change broke old-level retention, so this run keeps the
# proven 4-frame old-level anchor and uses the clean 4.68 s 1-5 routes.

[experiment]
id = "0085"
name = "ddqn_expert_replay_1_5_4frame"
status = "complete"
started = "2026-10-29"
completed = "2026-10-29"

[workflow]
name = "reinforcement.ddqn"

[game]
repo = "../dragon-jump-remaster"
branch = "prepare-for-expo"
commit = "fe7821d"
allow_dirty = false

[env]
levels = ["1-5", "1-5", "1-5", "1-5", "1-4", "1-3", "1-3", "1-2"]
n_envs = 8
agents_per_process = 1
action_repeat = 4
max_decisions = 150
speedup = 12.0
force_start_jump = false
reassert_held_jump = true
reward_profile = "default"
base_port = 23600
eval_port = 23700
timeout = 180
seed = 42
start_seed = 42

[observation]
encoding = "lean_stick"
preprocessing = "lean_stick"
expected_raw_size = 191
model_input_size = 957

[model]
arch = "dqn_mlp"
hidden = [512, 512]
activation = "relu"

[algorithm]
name = "dqn"
timesteps = 100000
n_steps = 3
learning_rate = 0.0001
buffer_size = 400000
online_buffer_size = 400000
anchor_fraction = 0.5
learning_starts = 10000
batch_size = 256
gamma = 0.99
tau = 1.0
train_freq = 4
gradient_steps = 4
target_update_interval = 1000
exploration_fraction = 0.75
exploration_initial_eps = 1.0
exploration_final_eps = 0.1
expert_td_weight = 1.0
expert_batch_size = 64
behavior_margin_weight = 0.2
behavior_margin = 0.5
old_margin_weight = 0.1
old_margin_batch_size = 64

[data]
archive = "runs/neat_transfer_1_5_from_1_4/archive/routes.json"
finishers = "runs/neat_transfer_1_5_from_1_4/archive/finishers.jsonl"
level_analysis = "../dragon-jump-remaster/runs/level_analysis/1-5.json"
min_time_to_exit = 0.5
train_pool = "runs/neat_speed_1_5_from_0080/pool_4frame/multilevel_train_start_pool.json"
holdout_pool = "runs/neat_speed_1_5_from_0080/pool_4frame/holdout_start_pool.json"
expert_routes = "runs/neat_speed_1_5_from_0080/clean_4frame_routes.json"
expert_data = "runs/ddqn_expert_replay_1_5_4frame/expert_1_5/expert_routes.npz"
old_anchor = "runs/ddqn_anchor_1530000_all_levels_191/replay_buffer_200k.pkl"

[checkpointing]
save_freq = 25000

[run]
resume_from = "runs/ddqn_expert_replay_1_4_lean_stick/dqn/checkpoints/ddqn_1555000_steps.zip"
reset_timesteps = false
anchor_buffer_from = "runs/ddqn_anchor_1530000_all_levels_191/replay_buffer_200k.pkl"
expert_buffer_from = "runs/ddqn_expert_replay_1_5_4frame/expert_buffer_1_5.pkl"
preprocessing_from = "runs/ddqn_fresh_1_1_lean_stick/preprocessing.pkl"
device = "cpu"
verbose = 1

[output]
dir = "runs/ddqn_expert_replay_1_5_4frame"
model_file = "dqn/dqn_final.zip"
monitor_file = "dqn/monitor.csv"
checkpoint_dir = "dqn/checkpoints"

[evaluation]
canonical = true
train_pool = false
holdout_pool = false
