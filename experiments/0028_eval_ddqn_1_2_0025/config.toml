[experiment]
id = "0028"
name = "eval_ddqn_1_2_0025"
status = "planned"

[workflow]
name = "reinforcement.ddqn"

[game]
repo = "../dragon-jump-remaster"
branch = "prepare-for-expo"
commit = "adb9278"
allow_dirty = true

[env]
levels = ["1-2"]
n_envs = 1
agents_per_process = 1
action_repeat = 4
max_decisions = 150
speedup = 12.0
force_start_jump = false
reward_profile = "default"
base_port = 14800
eval_port = 14900
timeout = 180
seed = 42
start_seed = 42

[observation]
encoding = "lean"
preprocessing = "lean"
expected_raw_size = 188
model_input_size = 954

[model]
arch = "dqn_mlp"
hidden = [512, 512]
activation = "relu"

[algorithm]
name = "dqn"
timesteps = 1

[data]
archive = "runs/neat_clean_450_1_2_transfer/archive/routes.json"
finishers = "runs/neat_clean_450_1_2_transfer/archive/finishers.jsonl"
level_analysis = "../dragon-jump-remaster/runs/level_analysis/1-2.json"
min_time_to_exit = 0.5
train_pool = "runs/neat_clean_450_1_2_transfer/pool_j07_cap1/train_start_pool.json"
holdout_pool = "runs/neat_clean_450_1_2_transfer/pool_j07_cap1/holdout_start_pool.json"

[evaluation]
canonical = true
sets = [
  "runs/neat_clean_450_1_2_transfer/pool_j07_cap1/train_start_pool.json",
  "runs/neat_clean_450_1_2_transfer/pool_j07_cap1/holdout_start_pool.json",
]

[run]
preprocessing_from = "runs/ppo_clean_start_1_1_fresh/preprocessing.pkl"
device = "cpu"
verbose = 1

[output]
dir = "runs/dqn_multilevel_1_1_1_2_1_3_ddqn_300k"
model_file = "dqn/dqn_final.zip"
monitor_file = "dqn/monitor.csv"
checkpoint_dir = "dqn/checkpoints"
