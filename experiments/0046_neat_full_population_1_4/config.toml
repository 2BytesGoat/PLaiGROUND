[experiment]
id = "0046"
name = "neat_full_population_1_4"
status = "complete"
started = "2026-10-29"
completed = "2026-10-29"

[workflow]
name = "genetic.neat"

[game]
repo = "../dragon-jump-remaster"
branch = "prepare-for-expo"
commit = "adb9278"
allow_dirty = true

[env]
level = "1-4"
population = 384
parallel = 8
action_repeat = 4
speedup = 12.0
max_steps = 300

[observation]
encoding = "legacy_stick"
size = 61
note = "Keep the validated 61-value contract."

[action]
reassert_held_jump = true

[source]
seed_checkpoint = "runs/neat_seeded_1_4_stick/seed-checkpoint-0"
source_run = "runs/neat_seeded_1_4_stick/archive"
source_level = "1-4"
source_routes = 4
note = "0038 seed replayed with evaluated finisher genomes merged back and all finishers preserved, including >10 s finishers."

[collection]
record_paths = true
generations = 30
min_clean_routes = 0
checkpoint_interval = 1
rebalance_every = 2
rebalance_final = true

[evaluation]
canonical = false
note = "Evaluate the selected checkpoint on all 384 genomes; use the per-generation history to find the peak finisher population."

[seed_gate]
finish_rate_target = 0.90
clean_clusters_required = 4
note = "Do not use the checkpoint as the 1-5 seed until the evaluated population is finisher-rich and diverse."

[output]
dir = "runs/neat_seeded_1_4_stick_full_population"
archive_dir = "runs/neat_seeded_1_4_stick_full_population/archive"

[run]
command = "caffeinate -dimsu .venv/bin/python scripts/genetic/01_neat.py --level 1-4 --obs-encoding legacy_stick --reassert-held-jump --resume runs/neat_seeded_1_4_stick/seed-checkpoint-0 --output-dir runs/neat_seeded_1_4_stick_full_population --archive-dir runs/neat_seeded_1_4_stick_full_population/archive --generations 30 --population 384 --parallel 8 --action-repeat 4 --speedup 12 --max-steps 300 --record-paths --checkpoint-interval 1 --rebalance-every 2 --rebalance-final --port 17500"

[result]
status = "complete"
note = "30 generations. Final generation 380/384 finishes; peak 383/384 at gens 12 and 26; best 4.9833 s; 75 clean routes. Final rebalance selected 384 finishers. Independent checkpoint-30 evaluation: 382/384 finishes, best 4.9833 s."
