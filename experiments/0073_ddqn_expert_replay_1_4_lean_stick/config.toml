# Experiment 0073: one-step DDQN with 1-4 expert replay and retention margin.

[experiment]
id = "0073"
name = "ddqn_expert_replay_1_4_lean_stick"
status = "complete"
started = "2026-10-29"
completed = "2026-10-29"

[workflow]
name = "reinforcement.ddqn"

[game]
repo = "../dragon-jump-remaster"
branch = "prepare-for-expo"
commit = "adb9278"
allow_dirty = true

[env]
# Agreed level-N schedule: 4 current + 1 previous + 3 retention.
levels = ["1-4", "1-4", "1-4", "1-4", "1-3", "1-2", "1-2", "1-1"]
n_envs = 8
agents_per_process = 1
action_repeat = 4
max_decisions = 150
speedup = 12.0
force_start_jump = false
reassert_held_jump = true
reward_profile = "default"
base_port = 22800
eval_port = 22900
timeout = 180
seed = 42
start_seed = 42

[observation]
encoding = "lean_stick"
preprocessing = "lean_stick"
expected_raw_size = 191
model_input_size = 957

[model]
arch = "dqn_mlp"
hidden = [512, 512]
activation = "relu"

[algorithm]
name = "dqn"
timesteps = 100000
n_steps = 3
learning_rate = 0.0001
buffer_size = 400000
online_buffer_size = 400000
anchor_fraction = 0.5
learning_starts = 10000
batch_size = 256
gamma = 0.99
tau = 1.0
train_freq = 4
gradient_steps = 4
target_update_interval = 1000
exploration_fraction = 0.75
exploration_initial_eps = 1.0
exploration_final_eps = 0.1
# One-step expert replay: TD on the 1-4 expert buffer, plus a margin that
# ranks the expert action above the alternatives. The old anchor gets a
# smaller margin term so the 1-1/1-2/1-3 action ranking is retained.
expert_td_weight = 1.0
expert_batch_size = 64
behavior_margin_weight = 0.2
behavior_margin = 0.5
old_margin_weight = 0.1
old_margin_batch_size = 64

[data]
archive = "runs/neat_seeded_1_4_stick_full_population/archive/routes.json"
finishers = "runs/neat_seeded_1_4_stick_full_population/archive/finishers.jsonl"
level_analysis = "../dragon-jump-remaster/runs/level_analysis/1-4.json"
min_time_to_exit = 0.5
train_pool = "runs/neat_seeded_1_4_stick_full_population/pool/multilevel_train_start_pool.json"
holdout_pool = "runs/neat_seeded_1_4_stick_full_population/pool/holdout_start_pool.json"
expert_routes = "runs/neat_seeded_1_4_stick_full_population/filtered/train_clean_routes.json"
expert_data = "runs/ddqn_expert_replay_1_4_lean_stick/expert_1_4/expert_routes.npz"
old_anchor = "runs/ddqn_anchor_1530000_all_levels_191/replay_buffer_200k.pkl"

[checkpointing]
save_freq = 25000

[result]
status = "complete"
selected_checkpoint = "dqn/checkpoints/ddqn_1555000_steps.zip"
selected_step = "1.555M"
note = "One-step expert replay + margin works. 1-4 at 1.555M: canonical 1/1 at 4.4667 s; train 11/11 at 6.7333 s (best 4.4667); holdout 2/2 at 6.0167 s (best 5.85). 1.58M/1.605M/1.63M fail the 1-4 canonical/train/holdout gate, so 1.555M is the only 1-4 candidate. Old levels at 1.555M: 1-1 1.5667, 12/12, 8/8; 1-2 3.1500, 31/31, 20/20 (holdout 4.4750); 1-3 3.2667, 45/45, 23/23 (holdout 5.6500). Full coverage retained; 1-2/1-3 canonical are slower than the 1.53M baseline (3.0167 / 3.1667). 1.63M has the better 1-2 (3.0167, holdout 3.3583) but fails 1-4 (0/1 canonical, 7/11 train, 1/2 holdout). Keep 1.53M as the old-level-only reference; 1.555M is the 1-4 chain checkpoint."
probe_gate = "pass: 1-4 canonical 1/1, train 11/11, holdout 2/2; old coverage full"

[evaluation]
canonical = true
train_pool = false
holdout_pool = false

[run]
resume_from = "runs/ddqn_fresh_1_1_retention_lean_stick/dqn/checkpoints/ddqn_1530000_steps.zip"
reset_timesteps = false
anchor_buffer_from = "runs/ddqn_anchor_1530000_all_levels_191/replay_buffer_200k.pkl"
expert_buffer_from = "runs/ddqn_expert_replay_1_4_lean_stick/expert_buffer_1_4.pkl"
preprocessing_from = "runs/ddqn_fresh_1_1_lean_stick/preprocessing.pkl"
device = "cpu"
verbose = 1

[output]
dir = "runs/ddqn_expert_replay_1_4_lean_stick"
model_file = "dqn/dqn_final.zip"
monitor_file = "dqn/monitor.csv"
checkpoint_dir = "dqn/checkpoints"
