[experiment]
id = "0018"
name = "dqn_multilevel_1_1_1_2_ddqn_300k"
status = "complete"
started = "2026-10-29"
completed = "2026-10-29"

[workflow]
name = "reinforcement.ddqn"

[game]
repo = "../dragon-jump-remaster"
branch = "prepare-for-expo"
commit = "adb9278"
allow_dirty = true

[env]
levels = "1-1,1-2"
n_envs = 8
agents_per_process = 1
action_repeat = 4
max_decisions = 150
speedup = 8.0
force_start_jump = false
reward_profile = "default"
base_port = 13800
eval_port = 13900
timeout = 180
seed = 42
start_seed = 42

[observation]
encoding = "lean"
preprocessing = "lean"
expected_raw_size = 188
model_input_size = 954

[model]
arch = "dqn_mlp"
hidden = [512, 512]
activation = "relu"

[algorithm]
name = "dqn"
