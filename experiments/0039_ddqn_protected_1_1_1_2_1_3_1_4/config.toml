[experiment]
id = "0039"
name = "ddqn_protected_1_1_1_2_1_3_1_4"
status = "complete"
started = "2026-10-29"
completed = "2026-10-29"

[workflow]
name = "reinforcement.ddqn"

[game]
repo = "../dragon-jump-remaster"
branch = "prepare-for-expo"
commit = "adb9278"
allow_dirty = true

[env]
# 4 current 1-4 + 2 previous 1-3 + 2 rotating old 1-2/1-1.
levels = ["1-4", "1-4", "1-4", "1-4", "1-3", "1-3", "1-2", "1-1"]
n_envs = 8
agents_per_process = 1
action_repeat = 4
max_decisions = 150
speedup = 12.0
force_start_jump = false
reassert_held_jump = true
reward_profile = "default"
base_port = 15800
eval_port = 15900
timeout = 180
seed = 42
start_seed = 42

[observation]
encoding = "lean"
preprocessing = "lean"
expected_raw_size = 188
model_input_size = 954

[model]
arch = "dqn_mlp"
hidden = [512, 512]
activation = "relu"

[algorithm]
name = "dqn"
timesteps = 300000
# Online partition; the anchor is separate and never evicted.
buffer_size = 400000
online_buffer_size = 400000
anchor_fraction = 0.25
learning_starts = 10000
batch_size = 256
gamma = 0.99
tau = 1.0
train_freq = 4
gradient_steps = 4
target_update_interval = 1000
exploration_fraction = 0.5
exploration_initial_eps = 1.0
exploration_final_eps = 0.02

[data]
archive = "runs/neat_seeded_1_4_stick/archive/routes.json"
finishers = "runs/neat_seeded_1_4_stick/archive/finishers.jsonl"
level_analysis = "../dragon-jump-remaster/runs/level_analysis/1-4.json"
min_time_to_exit = 0.5
train_pool = "runs/neat_seeded_1_4_stick/pool/multilevel_train_start_pool.json"
holdout_pool = "runs/neat_seeded_1_4_stick/pool/holdout_start_pool.json"

[checkpointing]
save_freq = 25000

[result]
status = "complete_negative_1_4"
note = "Final 2.525M: 1-4 canonical 0/1, train 1/9 at 6.7833 s, holdout 1/3 at 6.7833 s; old levels mostly retained (1-1 1.6167/12/12/8/8; 1-2 3.0333/30/31/19/20; 1-3 3.2333/45/45/23/23). No 1-4 checkpoint selected. Training monitor: 39/1,139 1-4 finishes, best 6.65 s."

[evaluation]
canonical = false
train_pool = false
holdout_pool = false

[run]
resume_from = "runs/ddqn_protected_1_1_1_2_1_3/dqn/checkpoints/ddqn_2225000_steps.zip"
reset_timesteps = false
anchor_buffer_from = "runs/ddqn_anchor_1_1_1_2/replay_buffer_200k.pkl"
preprocessing_from = "runs/ppo_clean_start_1_1_fresh/preprocessing.pkl"
device = "cpu"
verbose = 1

[output]
dir = "runs/ddqn_protected_1_1_1_2_1_3_1_4"
model_file = "dqn/dqn_final.zip"
monitor_file = "dqn/monitor.csv"
checkpoint_dir = "dqn/checkpoints"
