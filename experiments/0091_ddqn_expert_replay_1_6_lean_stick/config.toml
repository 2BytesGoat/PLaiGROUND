# 0091 — 1-6 DDQN from the 4-frame NEAT clean routes.

[experiment]
id = "0091"
name = "ddqn_expert_replay_1_6_lean_stick"
status = "complete"
started = "2026-10-29"
completed = "2026-10-29"

[workflow]
name = "reinforcement.ddqn"

[game]
repo = "../dragon-jump-remaster"
branch = "prepare-for-expo"
commit = "fe7821d"
allow_dirty = false

[env]
levels = ["1-6", "1-6", "1-6", "1-6", "1-5", "1-4", "1-4", "1-3"]
n_envs = 8
agents_per_process = 1
action_repeat = 4
max_decisions = 150
speedup = 12.0
force_start_jump = false
reassert_held_jump = true
reward_profile = "default"
base_port = 24600
eval_port = 24700
timeout = 180
seed = 42
start_seed = 42

[observation]
encoding = "lean_stick"
preprocessing = "lean_stick"
expected_raw_size = 191
model_input_size = 957

[model]
arch = "dqn_mlp"
hidden = [512, 512]
activation = "relu"

[algorithm]
name = "dqn"
timesteps = 100000
n_steps = 3
learning_rate = 0.0001
buffer_size = 400000
online_buffer_size = 400000
anchor_fraction = 0.5
learning_starts = 10000
batch_size = 256
gamma = 0.99
tau = 1.0
train_freq = 4
gradient_steps = 4
target_update_interval = 1000
exploration_fraction = 0.75
exploration_initial_eps = 1.0
exploration_final_eps = 0.1
expert_td_weight = 1.0
expert_batch_size = 64
behavior_margin_weight = 0.2
behavior_margin = 0.5
old_margin_weight = 0.2
old_margin_batch_size = 64

[data]
archive = "runs/neat_transfer_1_6_from_1_5/archive/routes.json"
finishers = "runs/neat_transfer_1_6_from_1_5/archive/finishers.jsonl"
level_analysis = "../dragon-jump-remaster/runs/level_analysis/1-6.json"
min_time_to_exit = 0.5
train_pool = "runs/neat_transfer_1_6_from_1_5/pool/multilevel_train_start_pool.json"
holdout_pool = "runs/neat_transfer_1_6_from_1_5/pool/holdout_start_pool.json"
expert_routes = "runs/neat_transfer_1_6_from_1_5/filtered/train_clean_routes.json"
expert_data = "runs/ddqn_expert_replay_1_6_lean_stick/expert_1_6/expert_routes.npz"
old_anchor = "runs/ddqn_anchor_1555_all_levels_4frame/rare/replay_buffer_200k.pkl"

[checkpointing]
save_freq = 25000

[run]
resume_from = "runs/ddqn_expert_replay_1_5_4frame/dqn/dqn_final.zip"
reset_timesteps = false
anchor_buffer_from = "runs/ddqn_anchor_1555_all_levels_4frame/rare/replay_buffer_200k.pkl"
expert_buffer_from = "runs/ddqn_expert_replay_1_6_lean_stick/expert_buffer_1_6.pkl"
preprocessing_from = "runs/ddqn_fresh_1_1_lean_stick/preprocessing.pkl"
device = "cpu"
verbose = 1

[output]
dir = "runs/ddqn_expert_replay_1_6_lean_stick"
model_file = "dqn/dqn_final.zip"
monitor_file = "dqn/monitor.csv"
checkpoint_dir = "dqn/checkpoints"

[evaluation]
canonical = true
train_pool = false
holdout_pool = false
