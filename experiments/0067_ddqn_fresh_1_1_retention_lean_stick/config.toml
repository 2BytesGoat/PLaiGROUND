# Experiment 0067: 1-1 retention continuation on the fresh lean_stick 191 chain.

[experiment]
id = "0067"
name = "ddqn_fresh_1_1_retention_lean_stick"
status = "complete"
started = "2026-10-29"
completed = "2026-10-29"

[workflow]
name = "reinforcement.ddqn"

[game]
repo = "../dragon-jump-remaster"
branch = "prepare-for-expo"
commit = "adb9278"
allow_dirty = true

[env]
# 1-1-heavy retention: 4 current 1-1 + 2 1-2 + 2 1-3.
levels = ["1-1", "1-1", "1-1", "1-1", "1-2", "1-2", "1-3", "1-3"]
n_envs = 8
agents_per_process = 1
action_repeat = 4
max_decisions = 150
speedup = 12.0
force_start_jump = false
reassert_held_jump = true
reward_profile = "default"
base_port = 20800
eval_port = 20900
timeout = 180
seed = 42
start_seed = 42

[observation]
encoding = "lean_stick"
preprocessing = "lean_stick"
expected_raw_size = 191
model_input_size = 957
note = "1-1 retention from 1.5M. The 1.3M 1-1/1-2 anchor pulls the drifted 1-1 holdout start back without a full retrain."

[model]
arch = "dqn_mlp"
hidden = [512, 512]
activation = "relu"

[algorithm]
name = "dqn"
# Short retention continuation after the selected 1.5M checkpoint.
timesteps = 50000
n_steps = 3
learning_rate = 0.0001
buffer_size = 200000
online_buffer_size = 200000
anchor_fraction = 0.25
learning_starts = 10000
batch_size = 256
gamma = 0.99
tau = 1.0
train_freq = 4
gradient_steps = 4
target_update_interval = 1000
exploration_fraction = 0.5
exploration_initial_eps = 1.0
exploration_final_eps = 0.02

[data]
archive = "runs/neat_frequent_rebalance_1_3/archive/routes.json"
finishers = "runs/neat_frequent_rebalance_1_3/archive/finishers.jsonl"
level_analysis = "../dragon-jump-remaster/runs/level_analysis/1-3.json"
min_time_to_exit = 0.5
train_pool = "runs/dqn_multilevel_1_1_1_2_1_3/pool/train_start_pool_v2.json"
holdout_pool = "runs/neat_frequent_rebalance_1_3/pool/holdout_start_pool.json"

[checkpointing]
save_freq = 10000

[result]
status = "complete; 1.53M selected"
selected_checkpoint = "runs/ddqn_fresh_1_1_retention_lean_stick/dqn/checkpoints/ddqn_1530000_steps.zip"
canonical_1_1 = 1.5667
train_1_1 = "12/12, median 3.2583"
holdout_1_1 = "8/8, median 3.8000"
canonical_1_2 = 3.0167
train_1_2 = "31/31, median 4.3500"
holdout_1_2 = "20/20, median 3.8833"
canonical_1_3 = 3.1667
train_1_3 = "45/45, median 5.4667"
holdout_1_3 = "23/23, median 5.5333"
note = "The 1-1 holdout recovered at 1.53M: [25,10] 4.6500 -> 3.4333 and the pool median 4.2667 -> 3.8000. The 1-3 pool is unchanged and 1-2 canonical/train are retained, but one 1-2 holdout start [24,17] regressed 3.1500 -> 4.7333, moving the 1-2 holdout median to 3.8833. 1.55M is not selected: it over-trained and 1-2 canonical collapsed to 3.8333. The selected chain checkpoint is 0067 1.53M."
selected_gate = "1-1 pass; 1-3 full; 1-2 canonical/train retained; 1-2 holdout 3.8833 (one-start regression)"

[evaluation]
canonical = true
train_pool = false
holdout_pool = false

[run]
resume_from = "runs/ddqn_fresh_1_1_1_2_1_3_lean_stick/dqn/checkpoints/ddqn_1500000_steps.zip"
reset_timesteps = false
anchor_buffer_from = "runs/ddqn_anchor_fresh_1_1_1_2_191/replay_buffer_200k.pkl"
preprocessing_from = "runs/ddqn_fresh_1_1_lean_stick/preprocessing.pkl"
device = "cpu"
verbose = 1

[output]
dir = "runs/ddqn_fresh_1_1_retention_lean_stick"
model_file = "dqn/dqn_final.zip"
monitor_file = "dqn/monitor.csv"
checkpoint_dir = "dqn/checkpoints"
