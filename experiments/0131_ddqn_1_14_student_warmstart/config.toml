# 0131 — 1-14 DDQN warm-started from the one-hot distilled student.

[experiment]
id = "0131"
name = "ddqn_1_14_student_warmstart"
status = "running"
started = "2026-10-30"

[workflow]
name = "reinforcement.ddqn"

[game]
repo = "../dragon-jump-remaster"
branch = "prepare-for-expo"
commit = "50dcc66"
allow_dirty = false

[env]
levels = ["1-14"]
n_envs = 8
agents_per_process = 1
action_repeat = 4
max_decisions = 180
speedup = 12.0
force_start_jump = false
reassert_held_jump = true
reward_profile = "default"
base_port = 31600
eval_port = 31700
timeout = 180
seed = 42
start_seed = 42

[observation]
encoding = "lean_stick"
preprocessing = "lean_stick"
expected_raw_size = 191
model_input_size = 957

[model]
arch = "dqn_mlp"
hidden = [512, 512]
activation = "relu"

[algorithm]
name = "dqn"
timesteps = 100000
n_steps = 3
learning_rate = 0.00005
buffer_size = 300000
learning_starts = 2000
batch_size = 256
gamma = 0.99
tau = 1.0
train_freq = 4
gradient_steps = 4
target_update_interval = 1000
exploration_fraction = 0.5
exploration_initial_eps = 0.1
exploration_final_eps = 0.02
expert_td_weight = 1.0
expert_batch_size = 64
behavior_margin_weight = 0.0
behavior_margin = 0.5
old_margin_weight = 0.0
old_margin_batch_size = 64

[data]
train_pool = "experiments/0131_ddqn_1_14_student_warmstart/canonical_start_pool.json"

[checkpointing]
save_freq = 10000

[run]
init_student = "runs/distill_campaign_student/students/cand_verified_onehot957_512/student.pt"
preprocessing_from = "runs/ddqn_fresh_1_1_lean_stick/preprocessing.pkl"
device = "cpu"
verbose = 1

[output]
dir = "runs/ddqn_1_14_student_warmstart"
model_file = "dqn/dqn_final.zip"
monitor_file = "dqn/monitor.csv"
checkpoint_dir = "dqn/checkpoints"

[evaluation]
canonical = true
train_pool = false
holdout_pool = false
sets = []
