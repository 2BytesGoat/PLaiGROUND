# 0079 — watch the selected 1.555M 1-4 chain checkpoint on 1-1 .. 1-4.
# Canonical only, one windowed Godot process per level (sequential).

[experiment]
id = "0079"
name = "show_chain_1_1_to_1_4_0073"
status = "complete"
started = "2026-10-29"
completed = "2026-10-29"

[workflow]
name = "reinforcement.ddqn"

[game]
repo = "../dragon-jump-remaster"
branch = "prepare-for-expo"
commit = "fe7821d"
allow_dirty = true

[env]
levels = ["1-1", "1-2", "1-3", "1-4"]
n_envs = 1
agents_per_process = 1
action_repeat = 4
max_decisions = 150
# 1x: the game clamps --speedup to a 1.0 floor, so 0.5 is not slow motion.
speedup = 1.0
force_start_jump = false
reassert_held_jump = true
reward_profile = "default"
base_port = 24000
eval_port = 24001
timeout = 180
seed = 42
start_seed = 42

[observation]
encoding = "lean_stick"
preprocessing = "lean_stick"
expected_raw_size = 191
model_input_size = 957

[model]
arch = "dqn_mlp"
hidden = [512, 512]
activation = "relu"

[algorithm]
name = "dqn"
timesteps = 1

[evaluation]
canonical = true
sets = []

[run]
preprocessing_from = "runs/ddqn_fresh_1_1_lean_stick/preprocessing.pkl"
device = "cpu"
verbose = 1

[output]
dir = "runs/chain_check_1_1_to_1_4_1555k"
model_file = "dqn/dqn_final.zip"
monitor_file = "dqn/monitor.csv"
checkpoint_dir = "dqn/checkpoints"
