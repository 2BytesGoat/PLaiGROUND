# Experiment 0059: continue the fresh lean_stick 191 1-1 run to 1.85M.

[experiment]
id = "0059"
name = "ddqn_fresh_1_1_lean_stick_continue"
status = "not_needed"
started = "2026-10-29"
stopped = "2026-10-29"

[workflow]
name = "reinforcement.ddqn"

[game]
repo = "../dragon-jump-remaster"
branch = "prepare-for-expo"
commit = "adb9278"
allow_dirty = true

[env]
levels = ["1-1"]
n_envs = 8
agents_per_process = 1
action_repeat = 4
max_decisions = 150
speedup = 12.0
force_start_jump = false
reassert_held_jump = true
reward_profile = "default"
base_port = 19300
eval_port = 19400
timeout = 180
seed = 42
start_seed = 42

[observation]
encoding = "lean_stick"
preprocessing = "lean_stick"
expected_raw_size = 191
model_input_size = 957
note = "Continuation of 0058; same fresh 191 backbone and 1-1 data. No reward change."

[model]
arch = "dqn_mlp"
hidden = [512, 512]
activation = "relu"

[algorithm]
# 0058 has 1M; this adds 850k to reach the 0013-equivalent 1.85M budget.
timesteps = 850000
n_steps = 3
learning_rate = 0.0001
buffer_size = 200000
learning_starts = 10000
batch_size = 256
gamma = 0.99
tau = 1.0
train_freq = 4
gradient_steps = 4
target_update_interval = 1000
exploration_fraction = 0.5
exploration_initial_eps = 1.0
exploration_final_eps = 0.02

[data]
archive = "runs/neat_clean_450/filtered/train_clean_routes.json"
finishers = "runs/neat_clean_450/archive/finishers.jsonl"
level_analysis = "../dragon-jump-remaster/runs/level_analysis/1-1.json"
min_time_to_exit = 0.5
train_pool = "runs/neat_clean_450/pool/train_start_pool.json"
holdout_pool = "runs/neat_clean_450/pool/holdout_start_pool.json"

[checkpointing]
save_freq = 25000

[evaluation]
canonical = true
sets = ["runs/neat_clean_450/pool/train_start_pool.json", "runs/neat_clean_450/pool/holdout_start_pool.json"]

[run]
resume_from = "runs/ddqn_fresh_1_1_lean_stick/dqn/dqn_final.zip"
reset_timesteps = false
preprocessing_from = "runs/ddqn_fresh_1_1_lean_stick/preprocessing.pkl"
device = "cpu"
verbose = 1

[output]
dir = "runs/ddqn_fresh_1_1_lean_stick"
model_file = "dqn/dqn_final.zip"
monitor_file = "dqn/monitor.csv"
checkpoint_dir = "dqn/checkpoints"
