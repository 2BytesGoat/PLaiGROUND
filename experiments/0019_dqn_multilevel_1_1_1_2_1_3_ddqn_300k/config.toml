[experiment]
id = "0019"
name = "dqn_multilevel_1_1_1_2_1_3_ddqn_300k"
status = "stopped; canonical-only fallback"
started = "2026-10-29"

[workflow]
name = "reinforcement.ddqn"

[game]
repo = "../dragon-jump-remaster"
branch = "prepare-for-expo"
commit = "adb9278"
allow_dirty = true

[env]
# 4 current 1-3 + 2 previous 1-2 + 2 rotating old 1-1.
levels = ["1-3", "1-3", "1-3", "1-3", "1-2", "1-2", "1-1", "1-1"]
n_envs = 8
agents_per_process = 1
action_repeat = 4
max_decisions = 150
speedup = 8.0
force_start_jump = false
reward_profile = "default"
base_port = 14000
eval_port = 14100
timeout = 180
seed = 42
start_seed = 42

[observation]
encoding = "lean"
preprocessing = "lean"
expected_raw_size = 188
model_input_size = 954

[model]
arch = "dqn_mlp"
hidden = [512, 512]
activation = "relu"

[algorithm]
name = "dqn"
# Additional steps after resume_from (2.15M + 300k = 2.45M).
timesteps = 300000
n_steps = 3
learning_rate = 0.0001
buffer_size = 200000
learning_starts = 10000
batch_size = 256
gamma = 0.99
tau = 1.0
train_freq = 4
gradient_steps = 4
target_update_interval = 1000
exploration_fraction = 0.5
exploration_initial_eps = 1.0
exploration_final_eps = 0.02

[data]
archive = "runs/neat_clean_450_1_3_transfer_from_1_2/archive/routes.json"
finishers = "runs/neat_clean_450_1_3_transfer_from_1_2/archive/finishers.jsonl"
level_analysis = "../dragon-jump-remaster/runs/level_analysis/1-3.json"
min_time_to_exit = 0.5
train_pool = "runs/dqn_multilevel_1_1_1_2_1_3/pool/train_start_pool.json"
holdout_pool = "runs/neat_clean_450_1_2_transfer/pool_j07_cap1/holdout_start_pool.json"

[checkpointing]
save_freq = 25000

[evaluation]
canonical = false
train_pool = false
holdout_pool = false

[result]
stopped_at_timesteps = 2274000
reason = "canonical-only 1-3 starts; replaced by NEAT 1-3 route collection"

[run]
resume_from = "runs/dqn_multilevel_1_1_1_2_ddqn_300k/dqn/checkpoints/ddqn_2150000_steps.zip"
reset_timesteps = false
preprocessing_from = "runs/ppo_clean_start_1_1_fresh/preprocessing.pkl"
device = "cpu"
verbose = 1

[output]
dir = "runs/dqn_multilevel_1_1_1_2_1_3"
model_file = "dqn/dqn_final.zip"
monitor_file = "dqn/monitor.csv"
checkpoint_dir = "dqn/checkpoints"
