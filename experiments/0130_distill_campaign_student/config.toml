# 0130 — distill the level experts and canonical teacher paths into one student.
#
# This is the end-of-campaign distillation pass. It does not train a new
# per-level expert. It captures the paths that already exist, records the
# selected expert's time on each NEAT start, and trains level-agnostic students
# on the same trajectories under different input encodings.

[experiment]
id = "0130"
name = "distill_campaign_student"
status = "data-captured; training pending"
started = "2026-10-30"

[game]
repo = "../dragon-jump-remaster"
branch = "prepare-for-expo"
commit = "50dcc66"
allow_dirty = false

[source]
# level -> selected expert checkpoint (DDQN, lean_stick 191)
experts = [
  { level = "1-1",  model = "runs/ddqn_expert_replay_1_4_lean_stick/dqn/checkpoints/ddqn_1555000_steps.zip" },
  { level = "1-2",  model = "runs/ddqn_expert_replay_1_4_lean_stick/dqn/checkpoints/ddqn_1555000_steps.zip" },
  { level = "1-3",  model = "runs/ddqn_expert_replay_1_4_lean_stick/dqn/checkpoints/ddqn_1555000_steps.zip" },
  { level = "1-4",  model = "runs/ddqn_expert_replay_1_4_lean_stick/dqn/checkpoints/ddqn_1555000_steps.zip" },
  { level = "1-5",  model = "runs/ddqn_expert_replay_1_5_4frame/dqn/dqn_final.zip" },
  { level = "1-6",  model = "runs/ddqn_1_6_start_repair/dqn/checkpoints/ddqn_1814952_steps.zip" },
  { level = "1-7",  model = "runs/ddqn_1_7_feasible_starts/dqn/checkpoints/ddqn_1877432_steps.zip" },
  { level = "1-8",  model = "runs/ddqn_1_8_canonical_nudge/dqn/checkpoints/ddqn_1960392_steps.zip" },
  { level = "1-9",  model = "runs/ddqn_1_9_single_route/dqn/checkpoints/ddqn_2060360_steps.zip" },
  { level = "1-10", model = "runs/ddqn_1_10_feasible_starts/dqn/checkpoints/ddqn_2122840_steps.zip" },
]

# 1-11 .. 1-16 have no DDQN expert. Use the archived 58-input PPO teacher when
# it finishes and is at least as fast as the deployed 58-input student;
# otherwise use the deployed student path.
canonical_teachers = [
  { level = "1-11", ppo = "archive/2026-10-27-cleanup/runs/teacher_champions/1-11/ppo_pilot.zip" },
  { level = "1-12", ppo = "archive/2026-10-27-cleanup/runs/teacher_champions/1-12/ppo_pilot.zip" },
  { level = "1-13", ppo = "archive/2026-10-27-cleanup/runs/teacher_champions/1-13/ppo_pilot.zip" },
  { level = "1-14", ppo = "archive/2026-10-27-cleanup/runs/teacher_champions/1-14/ppo_pilot.zip" },
  { level = "1-15", ppo = "archive/2026-10-27-cleanup/runs/teacher_champions/1-15/ppo_pilot.zip" },
  { level = "1-16", ppo = "archive/2026-10-27-cleanup/runs/teacher_champions/1-16/ppo_pilot.zip" },
]
deployed_student = "../dragon-jump-remaster/godot/src/resources/ai/student_obs58_256.json"

[preprocessing]
lean_stick = "runs/ddqn_fresh_1_1_lean_stick/preprocessing.pkl"

[data]
# Start pools used to capture each selected expert's paths and times.
pools = [
  { level = "1-1",  train = "runs/neat_clean_450/pool/train_start_pool.json", holdout = "runs/neat_clean_450/pool/holdout_start_pool.json" },
  { level = "1-2",  train = "runs/neat_clean_450_1_2_transfer/pool/train_start_pool.json", holdout = "runs/neat_clean_450_1_2_transfer/pool/holdout_start_pool.json" },
  { level = "1-3",  train = "runs/neat_explore_1_3_long/pool/train_start_pool.json", holdout = "runs/neat_explore_1_3_long/pool/holdout_start_pool.json" },
  { level = "1-4",  train = "runs/neat_seeded_1_4_stick_full_population/pool/train_start_pool.json", holdout = "runs/neat_seeded_1_4_stick_full_population/pool/holdout_start_pool.json" },
  { level = "1-5",  train = "runs/neat_speed_1_5_from_0080/pool_4frame/train_start_pool.json" },
  { level = "1-6",  train = "runs/neat_speed_1_6_from_0090/pool_state_70/train_start_pool.json", holdout = "runs/neat_speed_1_6_from_0090/pool_state_70/holdout_start_pool.json" },
  { level = "1-7",  train = "runs/neat_clean_1_7_from_0101_attempt2/pool_near_clean_g30/train_start_pool.json", holdout = "runs/neat_clean_1_7_from_0101_attempt2/pool_near_clean_g30/holdout_start_pool.json" },
  { level = "1-8",  train = "runs/neat_transfer_1_8_from_1_7/pool_clean_g46/train_start_pool.json", holdout = "runs/neat_transfer_1_8_from_1_7/pool_clean_g46/holdout_start_pool.json" },
  { level = "1-9",  train = "runs/neat_transfer_1_9_from_1_8/pool_clean_g89/train_start_pool.json", holdout = "runs/neat_transfer_1_9_from_1_8/pool_clean_g89/holdout_start_pool.json" },
  { level = "1-10", train = "runs/neat_transfer_1_10_from_1_9/pool_clean_g131/train_start_pool.json", holdout = "runs/neat_transfer_1_10_from_1_9/pool_clean_g131/holdout_start_pool.json" },
]

[output]
dir = "runs/distill_campaign_student"
checkpoint = "runs/distill_campaign_student/students"

[training]
# Candidate A: raw 191 lean_stick input.
# Candidate B: the existing 957 one-hot lean_stick input, as the quality reference.
# Candidate C: raw 191 with a wider first layer.
hidden = [512, 512]
wide_hidden = [1024, 512]
epochs = 200
batch_size = 256
learning_rate = 0.0003
weight_decay = 0.0001
seed = 0
