# 0095 — 1-6-only DDQN retrain from the 1.68M checkpoint.
# Removes the old-level environments and old anchor; uses 8 x 1-6, a 1-6 anchor,
# and the 4.50 s expert archive from 0093.

[experiment]
id = "0095"
name = "ddqn_1_6_retrain_1680"
status = "complete"
started = "2026-10-29"
completed = "2026-10-29"

[workflow]
name = "reinforcement.ddqn"

[game]
repo = "../dragon-jump-remaster"
branch = "prepare-for-expo"
commit = "fe7821d"
allow_dirty = false

[env]
levels = ["1-6", "1-6", "1-6", "1-6", "1-6", "1-6", "1-6", "1-6"]
n_envs = 8
agents_per_process = 1
action_repeat = 4
max_decisions = 150
speedup = 12.0
force_start_jump = false
reassert_held_jump = true
reward_profile = "default"
base_port = 25200
eval_port = 25300
timeout = 180
seed = 42
start_seed = 42

[observation]
encoding = "lean_stick"
preprocessing = "lean_stick"
expected_raw_size = 191
model_input_size = 957

[model]
arch = "dqn_mlp"
hidden = [512, 512]
activation = "relu"

[algorithm]
name = "dqn"
timesteps = 50000
n_steps = 3
learning_rate = 0.00005
buffer_size = 400000
online_buffer_size = 400000
anchor_fraction = 0.5
learning_starts = 2000
batch_size = 256
gamma = 0.99
tau = 1.0
train_freq = 4
gradient_steps = 4
target_update_interval = 1000
exploration_fraction = 0.5
exploration_initial_eps = 0.1
exploration_final_eps = 0.05
expert_td_weight = 1.0
expert_batch_size = 64
behavior_margin_weight = 0.2
behavior_margin = 0.5
old_margin_weight = 0.1
old_margin_batch_size = 64

[data]
archive = "runs/neat_transfer_1_6_from_1_5/archive/routes.json"
finishers = "runs/neat_transfer_1_6_from_1_5/archive/finishers.jsonl"
level_analysis = "../dragon-jump-remaster/runs/level_analysis/1-6.json"
min_time_to_exit = 0.5
train_pool = "runs/neat_transfer_1_6_from_1_5/pool/train_start_pool.json"
holdout_pool = "runs/neat_transfer_1_6_from_1_5/pool/holdout_start_pool.json"
expert_routes = "runs/neat_speed_1_6_from_0090/filtered/train_clean_routes.json"
expert_data = "runs/ddqn_1_6_retrain/expert_1_6/expert_routes.npz"
old_anchor = "runs/ddqn_anchor_1_6_1680/rare/replay_buffer_200k.pkl"

[checkpointing]
save_freq = 12500

[run]
resume_from = "runs/ddqn_expert_replay_1_6_lean_stick/dqn/checkpoints/ddqn_1680000_steps.zip"
reset_timesteps = false
anchor_buffer_from = "runs/ddqn_anchor_1_6_1680/rare/replay_buffer_200k.pkl"
expert_buffer_from = "runs/ddqn_1_6_retrain/expert_buffer_1_6.pkl"
preprocessing_from = "runs/ddqn_fresh_1_1_lean_stick/preprocessing.pkl"
device = "cpu"
verbose = 1

[output]
dir = "runs/ddqn_1_6_retrain"
model_file = "dqn/dqn_final.zip"
monitor_file = "dqn/monitor.csv"
checkpoint_dir = "dqn/checkpoints"

[evaluation]
canonical = true
train_pool = false
holdout_pool = false
