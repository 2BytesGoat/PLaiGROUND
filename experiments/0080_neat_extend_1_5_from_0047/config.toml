# 0080 — extend the 1-5 NEAT collection from the 0047 diagnostic.
# The 1-5-adapted population already finishes 384/384; this run grows the
# clean-route archive to the pool target, then filters and builds starts.

[experiment]
id = "0080"
name = "neat_extend_1_5_from_0047"
status = "complete"
started = "2026-10-29"
completed = "2026-10-29"

[workflow]
name = "genetic.neat"

[game]
repo = "../dragon-jump-remaster"
branch = "prepare-for-expo"
commit = "fe7821d"
allow_dirty = false

[env]
level = "1-5"
population = 384
parallel = 8
action_repeat = 4
speedup = 12.0
max_steps = 300

[observation]
encoding = "legacy_stick"
size = 61
note = "Keep the 1-4/1-5 training contract. Route starts are level cells, so the eventual lean_stick 191 policy can use the resulting pool."

[action]
reassert_held_jump = true

[source]
source_experiment = "0047"
resume_checkpoint = "runs/neat_transfer_1_5_from_1_4/neat-checkpoint-20"
archive_dir = "runs/neat_transfer_1_5_from_1_4/archive"
source_level = "1-5"
source_generation = 20
note = "Continue the 1-5-adapted population instead of repeating the 1-4 zero-shot probe. The archive is cumulative and stays with 0047; do not merge any 1-4 routes."

[collection]
record_paths = true
generations = 30
min_clean_routes = 25
checkpoint_interval = 1
rebalance_every = 2
rebalance_final = true
port = 18100
seed = 42
note = "At generation 20 the archive has 9 clean routes in 3 clusters. Target 25 clean routes so the pool has enough train/holdout clusters."

[handoff]
from_run = "runs/neat_transfer_1_5_from_1_4"
to_run = "runs/neat_extend_1_5_from_0047"
files = [
  "history.csv",
  "genome_stats.csv",
  "best_time.json",
  "best_time_genome.pkl",
  "best_clean.json",
  "best_clean_genome.pkl",
  "best_genome.pkl",
]
note = "Copied before resume so the extended run keeps generations 1-20 in its history and bests."

[output]
dir = "runs/neat_extend_1_5_from_0047"
archive_dir = "runs/neat_transfer_1_5_from_1_4/archive"

[run]
command = "caffeinate -dimsu .venv/bin/python scripts/genetic/01_neat.py --level 1-5 --obs-encoding legacy_stick --reassert-held-jump --resume runs/neat_transfer_1_5_from_1_4/neat-checkpoint-20 --output-dir runs/neat_extend_1_5_from_0047 --archive-dir runs/neat_transfer_1_5_from_1_4/archive --generations 30 --parallel 8 --action-repeat 4 --speedup 12 --max-steps 300 --record-paths --checkpoint-interval 1 --rebalance-every 2 --rebalance-final --min-clean-routes 25 --port 18100"
