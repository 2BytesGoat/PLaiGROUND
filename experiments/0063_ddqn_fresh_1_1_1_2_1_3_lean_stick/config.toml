# Experiment 0063: 1-3 stage on the fresh lean_stick 191 backbone.

[experiment]
id = "0063"
name = "ddqn_fresh_1_1_1_2_1_3_lean_stick"
status = "complete"
started = "2026-10-29"
completed = "2026-10-29"

[workflow]
name = "reinforcement.ddqn"

[game]
repo = "../dragon-jump-remaster"
branch = "prepare-for-expo"
commit = "adb9278"
allow_dirty = true

[env]
# 4 current 1-3 + 2 1-2 retention + 2 1-1 retention.
levels = ["1-3", "1-3", "1-3", "1-3", "1-2", "1-2", "1-1", "1-1"]
n_envs = 8
agents_per_process = 1
action_repeat = 4
max_decisions = 150
speedup = 12.0
force_start_jump = false
reassert_held_jump = true
reward_profile = "default"
base_port = 19900
eval_port = 20000
timeout = 180
seed = 42
start_seed = 42

[observation]
encoding = "lean_stick"
preprocessing = "lean_stick"
expected_raw_size = 191
model_input_size = 957
note = "Fresh 191 chain. A 200k 1-1/1-2 anchor from the selected 0060 1.3M model protects the 1.5667 / 3.0333 behavior."

[model]
arch = "dqn_mlp"
hidden = [512, 512]
activation = "relu"

[algorithm]
name = "dqn"
# Additional steps after the selected 1.3M 1-2 checkpoint.
timesteps = 300000
n_steps = 3
learning_rate = 0.0001
buffer_size = 400000
online_buffer_size = 400000
anchor_fraction = 0.25
learning_starts = 10000
batch_size = 256
gamma = 0.99
tau = 1.0
train_freq = 4
gradient_steps = 4
target_update_interval = 1000
exploration_fraction = 0.5
exploration_initial_eps = 1.0
exploration_final_eps = 0.02

[data]
archive = "runs/neat_frequent_rebalance_1_3/archive/routes.json"
finishers = "runs/neat_frequent_rebalance_1_3/archive/finishers.jsonl"
level_analysis = "../dragon-jump-remaster/runs/level_analysis/1-3.json"
min_time_to_exit = 0.5
# 88 tagged starts: 12 x 1-1 + 31 x 1-2 + 45 x 1-3.
train_pool = "runs/dqn_multilevel_1_1_1_2_1_3/pool/train_start_pool_v2.json"
holdout_pool = "runs/neat_frequent_rebalance_1_3/pool/holdout_start_pool.json"

[checkpointing]
save_freq = 25000

[result]
status = "complete; 1.5M selected"
selected_checkpoint = "runs/ddqn_fresh_1_1_1_2_1_3_lean_stick/dqn/checkpoints/ddqn_1500000_steps.zip"
canonical_1_3 = 3.1667
train_1_3 = "45/45, median 5.4667"
holdout_1_3 = "23/23, median 5.5500"
canonical_1_2 = 3.0167
train_1_2 = "31/31, median 4.4167"
holdout_1_2 = "20/20, median 3.3083"
canonical_1_1 = 1.5667
train_1_1 = "12/12, median 3.4167"
holdout_1_1 = "8/8, median 4.2667"
note = "1.5M selected over 1.6M/1.575M for the best old-level retention: 1-2 is essentially the 0060 baseline, 1-3 has full coverage and beats the 0031 canonical reference, and 1-1 canonical/train coverage are retained. The only remaining regression is the 1-1 holdout median (4.2667 vs 3.8000), driven mainly by one [25,10] start; 0067 targets that retention gap."
selected_gate = "1-3 full; 1-2 retained; 1-1 canonical/train retained; 1-1 holdout 4.2667 > 3.8000"

[evaluation]
canonical = true
train_pool = false
holdout_pool = false

[run]
resume_from = "runs/ddqn_fresh_1_1_1_2_lean_stick/dqn/checkpoints/ddqn_1300000_steps.zip"
reset_timesteps = false
anchor_buffer_from = "runs/ddqn_anchor_fresh_1_1_1_2_191/replay_buffer_200k.pkl"
preprocessing_from = "runs/ddqn_fresh_1_1_lean_stick/preprocessing.pkl"
device = "cpu"
verbose = 1

[output]
dir = "runs/ddqn_fresh_1_1_1_2_1_3_lean_stick"
model_file = "dqn/dqn_final.zip"
monitor_file = "dqn/monitor.csv"
checkpoint_dir = "dqn/checkpoints"
