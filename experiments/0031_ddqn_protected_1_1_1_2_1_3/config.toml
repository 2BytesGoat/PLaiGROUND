[experiment]
id = "0031"
name = "ddqn_protected_1_1_1_2_1_3"
status = "complete"
started = "2026-10-29"
completed = "2026-10-29"

[workflow]
name = "reinforcement.ddqn"

[game]
repo = "../dragon-jump-remaster"
branch = "prepare-for-expo"
commit = "adb9278"
allow_dirty = true

[env]
levels = ["1-3", "1-3", "1-3", "1-3", "1-2", "1-2", "1-1", "1-1"]
n_envs = 8
agents_per_process = 1
action_repeat = 4
max_decisions = 150
speedup = 12.0
force_start_jump = false
reward_profile = "default"
base_port = 15400
eval_port = 15500
timeout = 180
seed = 42
start_seed = 42

[observation]
encoding = "lean"
preprocessing = "lean"
expected_raw_size = 188
model_input_size = 954

[model]
arch = "dqn_mlp"
hidden = [512, 512]
activation = "relu"

[algorithm]
name = "dqn"
timesteps = 300000
# Online partition; the anchor is separate and never evicted.
buffer_size = 400000
online_buffer_size = 400000
anchor_fraction = 0.25
learning_starts = 10000
batch_size = 256
gamma = 0.99
tau = 1.0
train_freq = 4
gradient_steps = 4
target_update_interval = 1000
exploration_fraction = 0.5
exploration_initial_eps = 1.0
exploration_final_eps = 0.02

[data]
archive = "runs/neat_frequent_rebalance_1_3/archive/routes.json"
finishers = "runs/neat_frequent_rebalance_1_3/archive/finishers.jsonl"
level_analysis = "../dragon-jump-remaster/runs/level_analysis/1-3.json"
min_time_to_exit = 0.5
train_pool = "runs/dqn_multilevel_1_1_1_2_1_3/pool/train_start_pool_v2.json"
holdout_pool = "runs/neat_frequent_rebalance_1_3/pool/holdout_start_pool.json"

[checkpointing]
save_freq = 25000

[result]
final_total_timesteps = 2450000
selected_checkpoint = "dqn/checkpoints/ddqn_2225000_steps.zip"
selected_total_timesteps = 2225000
canonical_1_1 = 1.6167
train_1_1_finishes = 12
train_1_1_median = 3.2667
holdout_1_1_finishes = 8
holdout_1_1_median = 3.7917
canonical_1_2 = 2.9667
train_1_2_finishes = 31
